<!DOCTYPE html>
<html lang='pt-BR'>

<head>
    <meta charset='UTF-8' />
    <meta http-equiv='X-UA-Compatible' content='IE=edge' />
    <meta name='viewport' content='width=device-width, initial-scale=1.0' />
    <link rel='shortcut icon' href='/icon.png' type='image/png' />
    <!-- CSS -->
    <link rel='stylesheet' href='/style.css' />
    <title>Post-it Share</title>
    <!-- Google tag (gtag.js) -->
    <script async src='https://www.googletagmanager.com/gtag/js?id=G-TJQ2XJZPTD'></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-TJQ2XJZPTD');
    </script>
     <script src="/htmx.min.js"></script>
</head>

<body>
    <div class="sticky-note">
        <div 
            id="content" 
            class="content" 
            contenteditable="true" 
            oninput="document.getElementById('shareButton').disabled = !this.textContent.trim()">
        </div>
        
        <button 
            id="shareButton"
            disabled="true"
            hx-post="/notes"
            hx-trigger="click"
            hx-target="#share-link"
            hx-swap="innerHTML"
            hx-on:htmx:config-request="event.detail.parameters.content = content.innerHTML"
            hx-on:htmx:after-request="{
                document.getElementById('shareButton').disabled = true;
                document.getElementById('content').innerHTML = '';
            }"
        >Compartilhar
        </button>
    </div>

    <div id="share-link"></div>
</body>

</html>
